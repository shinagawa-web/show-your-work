worker_processes 4;
error_log /results/nginx-error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  log_format lab '$msec $request_id $status uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time rt=$request_time';
  access_log /results/nginx-access.log lab;
  upstream app {
    server lab-app:8081;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://app;
      proxy_set_header X-Request-Id $request_id;
      include /etc/nginx/extra/*.conf;
    }
  }
}
