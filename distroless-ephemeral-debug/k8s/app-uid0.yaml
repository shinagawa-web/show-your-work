apiVersion: v1
kind: Pod
metadata:
  name: app-uid0
  labels:
    app: app-uid0
spec:
  containers:
    - name: app
      image: distroless-app:dev
      imagePullPolicy: Never
      args: ["-http=:3000", "-stuck=3001"]
      env:
        - name: APP_MODE
          value: production
        - name: APP_UPSTREAM
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: app.json
      ports:
        - containerPort: 3000
      resources:
        requests:
          cpu: 500m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 64Mi
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 65532
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: config
          mountPath: /config
        - name: scratch
          mountPath: /scratch
    - name: sidecar
      image: distroless-app:dev
      imagePullPolicy: Never
      args: ["-http=:4000", "-stuck=0"]
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: config
      configMap:
        name: app-config
    - name: scratch
      emptyDir: {}
---
