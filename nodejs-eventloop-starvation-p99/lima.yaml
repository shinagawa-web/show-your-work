vmType: vz
os: Linux
arch: aarch64
cpus: 4
memory: 6GiB
disk: 30GiB

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

mounts: []

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      apt-get update
      apt-get install -y docker.io docker-compose-v2 curl xz-utils
      systemctl enable --now docker
      LIMA_USER=$(getent passwd | awk -F: '$6 ~ /\.guest$/ {print $1; exit}')
      usermod -aG docker "$LIMA_USER"
      curl -fsSL https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-arm64.tar.xz | tar -xJ -C /usr/local --strip-components=1
