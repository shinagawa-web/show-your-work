apiVersion: v1
kind: ConfigMap
metadata:
  name: kwok-provider-config
  namespace: kube-system
data:
  config: |
    apiVersion: v1alpha1
    readNodesFrom: configmap
    nodegroups:
      fromNodeLabelKey: kwok-nodegroup
    nodes:
      skipTaint: true
    configmap:
      name: kwok-provider-templates
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kwok-provider-templates
  namespace: kube-system
data:
  templates: |
    apiVersion: v1
    kind: List
    items:
      - apiVersion: v1
        kind: Node
        metadata:
          name: ng-a
          labels:
            kubernetes.io/os: linux
            kubernetes.io/arch: amd64
            type: kwok
            kwok-nodegroup: ng-a
          annotations:
            cluster-autoscaler.kwok.nodegroup/min-count: "@MIN_COUNT@"
            cluster-autoscaler.kwok.nodegroup/max-count: "10"
            cluster-autoscaler.kwok.nodegroup/desired-count: "@MIN_COUNT@"
        spec: {}
        status:
          allocatable:
            cpu: "4"
            memory: 16Gi
            pods: "110"
          capacity:
            cpu: "4"
            memory: 16Gi
            pods: "110"
