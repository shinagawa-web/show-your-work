apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-a
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: single-a
  template:
    metadata:
      labels:
        app: single-a
        tier: single
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    tier: single
      containers:
        - name: single-a
          image: @PAUSE_IMAGE@
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: single-a
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: single-a
---
