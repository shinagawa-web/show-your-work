apiVersion: apps/v1
kind: Deployment
metadata:
  name: one-per-node
spec:
  replicas: 3
  selector:
    matchLabels:
      app: one-per-node
  template:
    metadata:
      labels:
        app: one-per-node
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: one-per-node
      containers:
        - name: one-per-node
          image: @PAUSE_IMAGE@
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
