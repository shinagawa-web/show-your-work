apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-agent
  namespace: kube-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cluster-agent
  template:
    metadata:
      labels:
        app: cluster-agent
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: cluster-agent
      containers:
        - name: cluster-agent
          image: @PAUSE_IMAGE@
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
