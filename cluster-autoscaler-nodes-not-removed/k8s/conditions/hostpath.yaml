apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-reader
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: host-reader
  template:
    metadata:
      labels:
        app: host-reader
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: host-reader
      containers:
        - name: host-reader
          image: @PAUSE_IMAGE@
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: host-data
              mountPath: /data
      volumes:
        - name: host-data
          hostPath:
            path: /var/lib/host-reader
