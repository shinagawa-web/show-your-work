mode: deployment

image:
  repository: otel/opentelemetry-collector-k8s

command:
  name: otelcol-k8s

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    jaeger: null
    prometheus: null
    zipkin: null
  exporters:
    otlp_http:
      endpoint: http://jaeger:4318
  service:
    pipelines:
      traces:
        receivers:
          - otlp
        exporters:
          - otlp_http
          - debug
      metrics: null
      logs: null
