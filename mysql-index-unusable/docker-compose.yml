x-mysql: &mysql
  image: ${MYSQL_IMAGE:-mysql:8.4.11}
  environment:
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MYSQL_DATABASE: lab
  command:
    - --log-output=FILE
    - --slow-query-log=ON
    - --slow-query-log-file=/var/lib/mysql/slow.log
    - --long-query-time=0
  healthcheck:
    test: ["CMD", "mysql", "-h127.0.0.1", "-uroot", "-e", "SELECT 1"]
    interval: 2s
    timeout: 5s
    retries: 60

services:
  mysql: *mysql

  restore: *mysql

  php:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - php
