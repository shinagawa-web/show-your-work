apiVersion: v1
kind: Pod
metadata:
  name: k6
  namespace: demo
  annotations:
    proxy.istio.io/config: |
      proxyStatsMatcher:
        inclusionRegexps:
          - ".*outlier_detection.*"
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: k6
      image: @K6_TAG@
      imagePullPolicy: Never
      command: ["sh", "-c", "while :; do sleep 3600; done"]
      volumeMounts:
        - name: script
          mountPath: /scripts
        - name: out
          mountPath: /out
  volumes:
    - name: script
      configMap:
        name: k6-script
    - name: out
      emptyDir: {}
