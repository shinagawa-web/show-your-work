apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: demo
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-normal
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
      role: normal
  template:
    metadata:
      labels:
        app: app
        role: normal
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: @APP_TAG@
          imagePullPolicy: Never
          env:
            - name: DELAY_MS
              value: "@NORMAL_MS@"
            - name: STATUS
              value: "200"
            - name: BODY_DELAY_MS
              value: "0"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-bad
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
      role: bad
  template:
    metadata:
      labels:
        app: app
        role: bad
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: @APP_TAG@
          imagePullPolicy: Never
          env:
            - name: DELAY_MS
              value: "@BAD_DELAY_MS@"
            - name: STATUS
              value: "@BAD_STATUS@"
            - name: BODY_DELAY_MS
              value: "@BAD_BODY_DELAY_MS@"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 1
