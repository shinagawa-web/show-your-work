services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: lab
    command:
      - postgres
      - -c
      - log_min_duration_statement=0
      - -c
      - "log_line_prefix=%m [%p] app=%a "
    shm_size: 256m
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 1s
      timeout: 5s
      retries: 30
