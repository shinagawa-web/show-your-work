# One stack for all scenarios. After each scenario run-all.sh waits until the app has
# accepted and answered everything left in its accept queue, swaps the nginx config with
# nginx -s reload and resets the app through /admin; k6 is exec'd per scenario.
services:
  app:
    build: {context: ., target: app}
    image: rate-limit-cannot-protect-app:local
    command: ["/app"]
    sysctls:
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "65535"
    environment:
      LIMIT: "20"
      DELAY_LIGHT: "50"
      DELAY_HEAVY: "300"
      APP_PORT: "8081"
      ADMIN_PORT: "9001"
      ACCESS_LOG: /results/app_access.log
    volumes:
      - ./results/raw:/results
  nginx:
    image: nginx:1.30.5
    command: ["sh", "-c", "cp /confs/base.conf /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    # nginx closes the upstream connection first when it gives up (504/499), so those local
    # ports stay in TIME_WAIT; a wider range keeps connect() from running out of ports.
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65000"
    # open file limit for worker_connections 8192
    ulimits:
      nofile: 65536
    volumes:
      - ./nginx:/confs:ro
      - ./results/raw:/results
    depends_on: [app]
  # ss / nstat inside the app's network and PID namespaces (PID: so that ss -p can
  # tell accepted sockets, which have an owning fd, from sockets still in the accept queue)
  kernel:
    build: {context: ., target: probe}
    image: rate-limit-cannot-protect-probe:local
    command: ["/sampler"]
    network_mode: "service:app"
    pid: "service:app"
    environment:
      OUT: /results/kernel_100ms.csv
      SAMPLE_MS: "100"
    volumes:
      - ./results/raw:/results
    depends_on: [app]
  # bpftrace (host kernel): accept wait and accept-to-close time of port 8081 connections
  bpf:
    image: rate-limit-cannot-protect-probe:local
    privileged: true
    command: ["sh", "-c", "exec bpftrace -B line /bpf/accept.bt > /results/bpf.log"]
    environment:
      BPFTRACE_MAX_MAP_KEYS: "65536"
    volumes:
      - ./bpf:/bpf:ro
      - ./results/raw:/results
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/tracing:/sys/kernel/tracing
    depends_on: [kernel]
  k6:
    image: grafana/k6:2.3.0
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      K6_CSV_TIME_FORMAT: unix_milli
