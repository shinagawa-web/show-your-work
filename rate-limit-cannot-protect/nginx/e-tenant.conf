# Hypothesis E: per-tenant limit_req only (key $http_x_tenant, 50 r/s each). No global zone.
worker_processes auto;
events { worker_connections 8192; }
http {
  log_format rl '$msec $request_time $status $uri $http_x_tenant "$upstream_addr" "$upstream_status" "$upstream_connect_time" "$upstream_header_time" "$upstream_response_time"';
  access_log /results/access.log rl;
  error_log /results/error.log warn;

  limit_req_zone $http_x_tenant zone=tenant:1m rate=50r/s;
  limit_req_status 429;

  upstream downstream {
    zone downstream 64k;
    server downstream:8081;
  }

  server {
    listen 80;
    location /api/ {
      limit_req zone=tenant burst=10 nodelay;
      proxy_pass http://downstream;
      proxy_http_version 1.0;
      proxy_set_header Connection close;
      proxy_connect_timeout 1s;
      proxy_read_timeout 1s;
      proxy_next_upstream off;
    }
  }
}
