# Hypothesis D with nginx defaults: the same downstream (downstream:8081) listed three times,
# so nginx sees a 3-server upstream. No max_fails / fail_timeout (default max_fails=1
# fail_timeout=10s) and no proxy_next_upstream / proxy_next_upstream_tries lines (default
# proxy_next_upstream error timeout, tries 0 = unlimited). Only proxy_read_timeout is short.
worker_processes auto;
events { worker_connections 8192; }
http {
  log_format rl '$msec $request_time $status $uri $http_x_tenant "$upstream_addr" "$upstream_status" "$upstream_connect_time" "$upstream_header_time" "$upstream_response_time"';
  access_log /results/access.log rl;
  error_log /results/error.log warn;

  map $uri $global_key { default "all"; }
  limit_req_zone $global_key zone=global:1m rate=200r/s;
  limit_req_status 429;

  upstream downstream {
    zone downstream 64k;
    server downstream:8081;
    server downstream:8081;
    server downstream:8081;
  }

  server {
    listen 80;
    location /api/ {
      limit_req zone=global burst=20 nodelay;
      proxy_pass http://downstream;
      proxy_http_version 1.0;
      proxy_set_header Connection close;
      proxy_connect_timeout 1s;
      proxy_read_timeout 200ms;
    }
  }
}
