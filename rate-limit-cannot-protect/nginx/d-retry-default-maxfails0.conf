# Hypothesis D, proxy_next_upstream at its default (no proxy_next_upstream /
# proxy_next_upstream_tries lines) but max_fails=0 on each server, so servers are never
# marked unavailable. The same downstream (downstream:8081) listed three times.
worker_processes auto;
events { worker_connections 8192; }
http {
  log_format rl '$msec $request_time $status $uri $http_x_tenant "$upstream_addr" "$upstream_status" "$upstream_connect_time" "$upstream_header_time" "$upstream_response_time"';
  access_log /results/access.log rl;
  error_log /results/error.log warn;

  map $uri $global_key { default "all"; }
  limit_req_zone $global_key zone=global:1m rate=200r/s;
  limit_req_status 429;

  upstream downstream {
    zone downstream 64k;
    server downstream:8081 max_fails=0;
    server downstream:8081 max_fails=0;
    server downstream:8081 max_fails=0;
  }

  server {
    listen 80;
    location /api/ {
      limit_req zone=global burst=20 nodelay;
      proxy_pass http://downstream;
      proxy_http_version 1.0;
      proxy_set_header Connection close;
      proxy_connect_timeout 1s;
      proxy_read_timeout 200ms;
    }
  }
}
