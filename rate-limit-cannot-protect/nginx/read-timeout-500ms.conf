# base.conf with proxy_read_timeout 500ms.
# Per-tenant limit_req (key: X-Tenant header), one upstream server with a shared zone,
# proxy_read_timeout 1s. Everything else about proxying is the nginx 1.30.5 default
# (proxy_http_version, Connection header, upstream keepalive, proxy_next_upstream).
# worker_processes / worker_connections are raised so that the load generator, not
# nginx's connection table, is the only limit on the client side.
worker_processes auto;
events { worker_connections 8192; }
# error.log at the default level (error); error-info.log at info for the client-abort lines.
error_log /results/error.log;
error_log /results/error-info.log info;
http {
  log_format rl '$msec $request_time $status $uri $http_x_tenant "$upstream_addr" "$upstream_status" "$upstream_connect_time" "$upstream_header_time" "$upstream_response_time" $request_id';
  access_log /results/access.log rl;

  limit_req_zone $http_x_tenant zone=tenant:1m rate=50r/s;
  limit_req_status 429;

  upstream downstream {
    zone downstream 64k;
    server downstream:8081;
  }

  server {
    listen 80;
    location /api/ {
      limit_req zone=tenant burst=20 nodelay;
      proxy_pass http://downstream;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 500ms;
    }
  }
}
