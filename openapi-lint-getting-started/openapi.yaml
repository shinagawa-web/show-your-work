openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
  description: Orders, refunds, invoices, shops, sales and products of an online store.
servers:
  - url: https://api.orders.test/v1
security:
  - bearerAuth: []
tags:
  - name: orders
    description: Orders placed by customers.
  - name: refunds
    description: Refunds of paid orders.
  - name: invoices
    description: Invoices issued for orders.
  - name: shops
    description: Shops that sell products.
  - name: sales
    description: Sales figures of a shop.
  - name: products
    description: Products sold by shops.
paths:
  /orders:
    post:
      tags:
        - orders
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: The created order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
        - orders
      summary: List orders
      operationId: listOrders
      responses:
        '200':
          description: Orders of the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - orders
      summary: Get an order
      operationId: getOrder
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 3f6c2a1e-8b4d-4c3a-9e2f-1a2b3c4d5e6f
                shopId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                status: paid
                amount: '1200'
                created_at: '2026-11-01T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - orders
      summary: Update an order
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - orders
      summary: Delete an order
      operationId: deleteOrder
      responses:
        '204':
          description: The order was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/cancel:
    post:
      tags:
        - orders
      summary: Cancel an order
      operationId: cancelOrder
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/items:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags:
        - orders
      operationId: addOrderItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemInput'
      responses:
        '201':
          description: The added item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - orders
      summary: Get an item of an order
      operationId: getOrder
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /refunds:
    post:
      tags:
        - refunds
      summary: Refund an order
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundInput'
      responses:
        '201':
          description: The created refund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices:
    get:
      tags:
        - invoices
      operationId: listInvoices
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoices of the order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shops:
    post:
      tags:
        - shops
      operationId: createShop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopInput'
      responses:
        '201':
          description: The created shop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /sales:
    get:
      tags:
        - sales
      summary: Get sales of a shop
      operationId: getSales
      parameters:
        - name: X-Shop-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sales of the shop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sales'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    post:
      tags:
        - products
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: The created product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{id}:
    get:
      tags:
        - products
      summary: Get a product
      operationId: getProduct
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: The bearer token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller may not access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    OrderInput:
      type: object
      required:
        - shopId
      properties:
        shopId:
          type: string
          format: uuid
    Order:
      type: object
      required:
        - id
        - shopId
        - status
        - amount
        - created_at
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
        amount:
          type: integer
        created_at:
          type: string
          format: date-time
    OrderItemInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    OrderItem:
      type: object
      required:
        - id
        - productId
        - quantity
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
    RefundInput:
      type: object
      required:
        - orderId
        - amount
      properties:
        orderId:
          type: string
          format: uuid
        amount:
          type: integer
    Refund:
      type: object
      required:
        - id
        - orderId
        - amount
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        amount:
          type: integer
    Invoice:
      type: object
      required:
        - id
        - orderId
        - amount
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        amount:
          type: integer
    ShopInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Shop:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Sales:
      type: object
      required:
        - shopId
        - total
      properties:
        shopId:
          type: string
          format: uuid
        total:
          type: integer
    ProductInput:
      type: object
      required:
        - shopId
        - name
        - price
      properties:
        shopId:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
    Product:
      type: object
      required:
        - id
        - shopId
        - name
        - price
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
