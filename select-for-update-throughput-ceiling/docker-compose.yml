services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 1s
      timeout: 5s
      retries: 30

  runner:
    build: app
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: lab
      PGUSER: postgres
      PGPASSWORD: test
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - run
