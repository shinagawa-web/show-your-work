worker_processes auto;
error_log /lab/results/run/error.log warn;
pid /tmp/nginx.pid;

events {
}

http {
    log_format lab '$msec $status "$request" $request_id "$upstream_addr" "$upstream_status" "$upstream_connect_time"';
    access_log /lab/results/run/access.log lab;

    upstream backend {
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backend;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
