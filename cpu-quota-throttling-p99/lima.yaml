vmType: vz
os: Linux
arch: aarch64
cpus: 4
memory: 4GiB
disk: 20GiB

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

mounts: []

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      apt-get update
      apt-get install -y docker.io bpftrace python3 iproute2
      systemctl enable --now docker
      LIMA_USER=$(getent passwd | awk -F: '$6 ~ /\.guest$/ {print $1; exit}')
      usermod -aG docker "$LIMA_USER"
