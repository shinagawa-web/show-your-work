name: turborepo-cache-misses

on:
  workflow_dispatch:
  push:
    paths:
      - "turborepo-cache-misses/**"
      - ".github/workflows/turborepo-cache-misses.yml"

defaults:
  run:
    shell: bash
    working-directory: turborepo-cache-misses

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        job: [s3-deps, s3-main, s3-files, s3-env]
    name: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh ${{ matrix.job }}
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: turborepo-cache-misses-${{ matrix.job }}
          path: turborepo-cache-misses/results/

  report:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: turborepo-cache-misses-s3-*
          path: turborepo-cache-misses/artifacts/
      - id: summary
        run: |
          mkdir -p results
          for d in artifacts/*/P*/; do cp -r "${d%/}" results/; done
          cp "$(ls artifacts/*/versions.txt | head -1)" results/versions.txt
          rc=0
          node scripts/summary.mjs results || rc=$?
          if [ "$rc" -ne 0 ] && ! grep -q '^RUN INVALID' results/summary.md; then
            printf '\nRUN INVALID: scripts/summary.mjs exited with %s\n' "$rc" >> results/summary.md
          fi
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          marker='<!-- turborepo-cache-misses -->'
          { echo "$marker"; cat results/summary.md; } > results/comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@results/comment.md > /dev/null
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file results/comment.md
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: turborepo-cache-misses-report
          path: turborepo-cache-misses/results/
      - env:
          RC: ${{ steps.summary.outputs.rc }}
        run: exit "${RC:-1}"
