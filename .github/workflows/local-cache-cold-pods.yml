name: local-cache-cold-pods

on:
  workflow_dispatch:
  push:
    paths:
      - "local-cache-cold-pods/**"
      - ".github/workflows/local-cache-cold-pods.yml"

defaults:
  run:
    shell: bash
    working-directory: local-cache-cold-pods

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - { section: "2", condition: app-restart-local }
          - { section: "3-1", condition: app-restart-redis }
          - { section: "4-1", condition: redis-restart-none }
          - { section: "4-2", condition: redis-restart-none-short }
          - { section: "4-3", condition: redis-restart-rdb }
          - { section: "4-4", condition: redis-restart-none-probe }
          - { section: "4-4", condition: sentinel-restart }
          - { section: "4-4", condition: sentinel-kill }
          - { section: "4-5", condition: redis-restart-none-local }
    name: ${{ matrix.section }} (${{ matrix.condition }})
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh ${{ matrix.condition }}
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-cache-cold-pods-${{ matrix.condition }}
          path: local-cache-cold-pods/results/

  summary:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: local-cache-cold-pods-*
          path: local-cache-cold-pods/artifacts/
      - run: |
          mkdir -p results
          python3 -B scripts/report.py artifacts/*/*/ > results/summary.md
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          marker='<!-- local-cache-cold-pods -->'
          { echo "$marker"; cat results/summary.md; } > results/comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@results/comment.md > /dev/null
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file results/comment.md
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-cache-cold-pods-summary
          path: local-cache-cold-pods/results/summary.md
