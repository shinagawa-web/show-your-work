name: select-for-update-throughput-ceiling

on:
  workflow_dispatch:
  push:
    paths:
      - "select-for-update-throughput-ceiling/**"
      - ".github/workflows/select-for-update-throughput-ceiling.yml"

defaults:
  run:
    shell: bash
    working-directory: select-for-update-throughput-ceiling

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        condition:
          - baseline
          - p1
          - p2
          - p3
          - p4
          - f1
    name: run (${{ matrix.condition }})
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh ${{ matrix.condition }}
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: select-for-update-throughput-ceiling-${{ matrix.condition }}
          path: select-for-update-throughput-ceiling/results/
