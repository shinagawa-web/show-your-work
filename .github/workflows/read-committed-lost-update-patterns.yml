name: read-committed-lost-update-patterns

on:
  workflow_dispatch:
  push:
    paths:
      - "read-committed-lost-update-patterns/**"
      - ".github/workflows/read-committed-lost-update-patterns.yml"

defaults:
  run:
    shell: bash
    working-directory: read-committed-lost-update-patterns

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run all patterns
        run: |
          set -o pipefail
          chmod +x run_all.sh
          ./run_all.sh | tee results.txt
      - name: Summarize
        if: always()
        run: |
          {
            echo '```'
            grep -E '^(===|pattern=| +run| +[0-9]+ )' results.txt 2>/dev/null || echo "no results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: read-committed-lost-update-patterns
          path: read-committed-lost-update-patterns/results.txt
