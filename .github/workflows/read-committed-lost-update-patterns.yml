name: read-committed-lost-update-patterns

on:
  workflow_dispatch:
  push:
    paths:
      - "read-committed-lost-update-patterns/**"
      - ".github/workflows/read-committed-lost-update-patterns.yml"

defaults:
  run:
    shell: bash
    working-directory: read-committed-lost-update-patterns

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh
      - run: |
          { echo '```'; cat results/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: read-committed-lost-update-patterns-results
          path: read-committed-lost-update-patterns/results/
