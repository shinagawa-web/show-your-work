name: cpu-quota-throttling-p99

on:
  workflow_dispatch:
  push:
    paths:
      - "cpu-quota-throttling-p99/**"
      - ".github/workflows/cpu-quota-throttling-p99.yml"
      - ".github/actions/cpu-quota-throttling-p99-preflight/**"

env:
  EXEC: ""
  SAME_HOST: "1"
  DUR: "60"

defaults:
  run:
    shell: bash
    working-directory: cpu-quota-throttling-p99

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cpu-quota-throttling-p99-preflight
        with:
          section: preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-quota-throttling-p99-preflight
          path: cpu-quota-throttling-p99/results/

  s3:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cpu-quota-throttling-p99-preflight
        with:
          section: s3
      - name: Section 3 (repro)
        run: |
          set -o pipefail
          sections/s3_repro.sh | tee results/s3_stdout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-quota-throttling-p99-s3
          path: cpu-quota-throttling-p99/results/

  s4:
    needs: s3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpu-quota-throttling-p99-s3
          path: cpu-quota-throttling-p99/results/
      - name: Section 4 (investigation, reads s3 only)
        run: |
          set -o pipefail
          sections/s4_investigate.sh | tee results/s4_stdout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-quota-throttling-p99-s4
          path: cpu-quota-throttling-p99/results/s4_stdout.txt

  s6:
    needs: s3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpu-quota-throttling-p99-s3
          path: cpu-quota-throttling-p99/results/
      - name: Section 6 (mechanism, reads s3 only)
        run: |
          set -o pipefail
          sections/s6_mechanism.sh | tee results/s6_stdout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-quota-throttling-p99-s6
          path: cpu-quota-throttling-p99/results/s6_stdout.txt

  s5:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cpu-quota-throttling-p99-preflight
        with:
          section: s5
      - name: Section 3 baseline on this runner
        run: |
          set -o pipefail
          sections/s3_repro.sh | tee results/s3_stdout.txt
      - name: Section 5 (cause), compared with the s3 baseline of this runner
        run: |
          set -o pipefail
          sections/s5_cause.sh | tee results/s5_stdout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-quota-throttling-p99-s5
          path: cpu-quota-throttling-p99/results/

  s9:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cpu-quota-throttling-p99-preflight
        with:
          section: s9
      - name: Section 3 baseline on this runner
        run: |
          set -o pipefail
          sections/s3_repro.sh | tee results/s3_stdout.txt
      - name: Section 9 (verification), compared with the s3 baseline of this runner
        run: |
          set -o pipefail
          sections/s9_verify.sh | tee results/s9_stdout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-quota-throttling-p99-s9
          path: cpu-quota-throttling-p99/results/

  s10:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cpu-quota-throttling-p99-preflight
        with:
          section: s10
      - name: Section 10 (environments, installs and removes k3s)
        run: |
          set -o pipefail
          sections/s10_env.sh | tee results/s10_stdout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-quota-throttling-p99-s10
          path: cpu-quota-throttling-p99/results/
