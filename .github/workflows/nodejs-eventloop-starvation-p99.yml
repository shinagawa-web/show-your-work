name: nodejs-eventloop-starvation-p99

on:
  workflow_dispatch:
  push:
    paths:
      - "nodejs-eventloop-starvation-p99/**"
      - ".github/workflows/nodejs-eventloop-starvation-p99.yml"

defaults:
  run:
    shell: bash
    working-directory: nodejs-eventloop-starvation-p99

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        condition: [baseline, shed-150, profile]
    name: run (${{ matrix.condition }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: nodejs-eventloop-starvation-p99/.node-version
      - run: ./run-all.sh ${{ matrix.condition }}
      - run: cat results/*/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nodejs-eventloop-starvation-p99-${{ matrix.condition }}
          path: nodejs-eventloop-starvation-p99/results/
