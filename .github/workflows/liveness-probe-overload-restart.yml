name: liveness-probe-overload-restart

on:
  workflow_dispatch:
  push:
    paths:
      - "liveness-probe-overload-restart/**"
      - ".github/workflows/liveness-probe-overload-restart.yml"

defaults:
  run:
    shell: bash
    working-directory: liveness-probe-overload-restart

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { section: "3", condition: capacity, run: 1 }
          - { section: "3, 4, 5", condition: P1, run: 1 }
          - { section: "3, 4, 5", condition: P1, run: 2 }
          - { section: "3, 4, 5", condition: P1, run: 3 }
          - { section: "3", condition: P2, run: 1 }
          - { section: "3", condition: P2, run: 2 }
          - { section: "3", condition: P2, run: 3 }
          - { section: "5", condition: P3, run: 1 }
          - { section: "5", condition: P3, run: 2 }
          - { section: "5", condition: P3, run: 3 }
          - { section: "5", condition: P4, run: 1 }
          - { section: "5", condition: P4, run: 2 }
          - { section: "5", condition: P4, run: 3 }
          - { section: "5", condition: P5, run: 1 }
          - { section: "5", condition: P5, run: 2 }
          - { section: "5", condition: P5, run: 3 }
    name: ${{ matrix.section }} (${{ matrix.condition }}-${{ matrix.run }})
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh ${{ matrix.condition }}
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: liveness-probe-overload-restart-${{ matrix.condition }}-${{ matrix.run }}
          path: liveness-probe-overload-restart/results/

  summary:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: liveness-probe-overload-restart-*
          path: liveness-probe-overload-restart/artifacts/
      - run: |
          mkdir -p results
          python3 -B scripts/report.py artifacts/*/ > results/summary.md
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          marker='<!-- liveness-probe-overload-restart -->'
          { echo "$marker"; cat results/summary.md; } > results/comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@results/comment.md > /dev/null
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file results/comment.md
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: liveness-probe-overload-restart-summary
          path: liveness-probe-overload-restart/results/summary.md
