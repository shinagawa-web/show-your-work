name: probe-wait-by-server-type

on:
  workflow_dispatch:
  push:
    paths:
      - "probe-wait-by-server-type/**"
      - ".github/workflows/probe-wait-by-server-type.yml"

defaults:
  run:
    shell: bash
    working-directory: probe-wait-by-server-type

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: probe-wait-by-server-type-image
          path: probe-wait-by-server-type/.images/
          include-hidden-files: true
          retention-days: 1

  run:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: gunicorn, sections: "1, 3, 4" }
          - { server: tomcat, sections: "1, 3, 4" }
          - { server: tomcat-virtual, sections: "1, 3, 4" }
          - { server: tomcat-virtual-limit, sections: "3" }
          - { server: node, sections: "1, 3, 4" }
          - { server: go, sections: "1, 3, 4" }
          - { server: tomcat-mgmt, sections: "5" }
    name: ${{ matrix.sections }} (${{ matrix.server }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: probe-wait-by-server-type-image
          path: probe-wait-by-server-type/.images/
      - run: ./run-all.sh ${{ matrix.server }}
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-wait-by-server-type-run-${{ matrix.server }}
          path: probe-wait-by-server-type/results/

  report:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: probe-wait-by-server-type-run-*
          path: probe-wait-by-server-type/artifacts/
      - run: |
          mkdir -p results
          python3 -B scripts/report.py artifacts/*/ > results/summary.md
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          marker='<!-- probe-wait-by-server-type -->'
          { echo "$marker"; cat results/summary.md; } > results/comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@results/comment.md > /dev/null
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file results/comment.md
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-wait-by-server-type-summary
          path: probe-wait-by-server-type/results/summary.md
