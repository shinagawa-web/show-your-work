name: docker-init-cuts-requests

on:
  workflow_dispatch:
  push:
    paths:
      - "docker-init-cuts-requests/**"
      - ".github/workflows/docker-init-cuts-requests.yml"

defaults:
  run:
    shell: bash
    working-directory: docker-init-cuts-requests

jobs:
  opening-measurements-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          marker='<!-- docker-init-cuts-requests -->'
          { echo "$marker"; cat results/summary.md; } > results/comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@results/comment.md > /dev/null
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file results/comment.md
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-init-cuts-requests-results
          path: docker-init-cuts-requests/results/
