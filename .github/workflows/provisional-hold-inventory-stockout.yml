name: provisional-hold-inventory-stockout

on:
  workflow_dispatch:
  push:
    paths:
      - "provisional-hold-inventory-stockout/**"
      - ".github/workflows/provisional-hold-inventory-stockout.yml"

defaults:
  run:
    shell: bash
    working-directory: provisional-hold-inventory-stockout

jobs:
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh sim
      - run: |
          { echo '```'; cat results/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provisional-hold-inventory-stockout-results-sim
          path: provisional-hold-inventory-stockout/results/

  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: run (${{ matrix.shard }})
    env:
      RUNS: "2"
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provisional-hold-inventory-stockout-results-run-${{ matrix.shard }}
          path: provisional-hold-inventory-stockout/results/

  report:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: provisional-hold-inventory-stockout-results-run-*
          path: provisional-hold-inventory-stockout/results/
      - run: |
          python3 report.py results/*/output.txt > results/summary.txt
          { echo '```'; cat results/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provisional-hold-inventory-stockout-results-report
          path: provisional-hold-inventory-stockout/results/summary.txt
