name: provisional-hold-inventory-stockout

on:
  workflow_dispatch:
  push:
    paths:
      - "provisional-hold-inventory-stockout/**"
      - ".github/workflows/provisional-hold-inventory-stockout.yml"

defaults:
  run:
    shell: bash
    working-directory: provisional-hold-inventory-stockout

jobs:
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run sim.py
        run: |
          set -o pipefail
          chmod +x run_all.sh
          ./run_all.sh sim | tee results-sim.txt
      - name: Summarize
        if: always()
        run: |
          { echo '```'; cat results-sim.txt 2>/dev/null || echo "no results"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provisional-hold-inventory-stockout-sim
          path: provisional-hold-inventory-stockout/results-sim.txt

  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: run.py (${{ matrix.shard }})
    env:
      RUNS: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Run run.py
        run: |
          set -o pipefail
          chmod +x run_all.sh
          ./run_all.sh run | tee results-run-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provisional-hold-inventory-stockout-run-${{ matrix.shard }}
          path: provisional-hold-inventory-stockout/results-run-${{ matrix.shard }}.txt

  report:
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: provisional-hold-inventory-stockout-run-*
          merge-multiple: true
          path: provisional-hold-inventory-stockout/
      - name: Average run.py over all shards
        run: |
          python3 report.py results-run-*.txt | tee results-run.txt
          { echo '```'; cat results-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: provisional-hold-inventory-stockout-run
          path: provisional-hold-inventory-stockout/results-run.txt
