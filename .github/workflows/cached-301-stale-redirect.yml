name: cached-301-stale-redirect

on:
  workflow_dispatch:
  push:
    paths:
      - "cached-301-stale-redirect/**"
      - ".github/workflows/cached-301-stale-redirect.yml"

defaults:
  run:
    shell: bash
    working-directory: cached-301-stale-redirect

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - run: ./run-all.sh
      - run: cat results/*/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - run: cat results/*/durations.txt >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cached-301-stale-redirect-results
          path: cached-301-stale-redirect/results/
