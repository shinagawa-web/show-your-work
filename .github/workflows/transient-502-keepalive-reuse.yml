name: transient-502-keepalive-reuse

on:
  workflow_dispatch:
  push:
    paths:
      - "transient-502-keepalive-reuse/**"
      - ".github/workflows/transient-502-keepalive-reuse.yml"

defaults:
  run:
    shell: bash
    working-directory: transient-502-keepalive-reuse

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        condition:
          - baseline
          - idle-close
          - idle-close-nginx-shorter
    name: run (${{ matrix.condition }})
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh ${{ matrix.condition }}
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transient-502-keepalive-reuse-${{ matrix.condition }}
          path: transient-502-keepalive-reuse/results/
