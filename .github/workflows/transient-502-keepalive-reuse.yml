name: transient-502-keepalive-reuse

on:
  workflow_dispatch:
  push:
    paths:
      - "transient-502-keepalive-reuse/**"
      - ".github/workflows/transient-502-keepalive-reuse.yml"

defaults:
  run:
    shell: bash
    working-directory: transient-502-keepalive-reuse

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sc:
          - baseline-concurrent
          - baseline-concurrent-noturnover
          - retry-get
          - retry-post
          - nonidem-post
          - ka-timeout
          - drain
    name: run (${{ matrix.sc }})
    steps:
      - uses: actions/checkout@v7
      - run: ./run-all.sh ${{ matrix.sc }}
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transient-502-keepalive-reuse-${{ matrix.sc }}
          path: transient-502-keepalive-reuse/results/
