name: cpu-quota-throttling-p99 preflight
description: Install tools and check that the runner can reproduce CFS quota throttling (cgroup v2, Docker, bpftrace with BTF, throttle_cfs_rq kprobe), then record the runner environment
inputs:
  section:
    description: Section name used for the runner record file
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: cpu-quota-throttling-p99/loadgen/go.mod
        cache: false

    - name: Install tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bpftrace iproute2 python3

    - name: Check prerequisites
      shell: bash
      run: |
        set -euo pipefail
        fs=$(stat -fc %T /sys/fs/cgroup)
        echo "cgroup_fs=$fs"
        [ "$fs" = cgroup2fs ] || { echo "cgroup v2 is required"; exit 1; }
        echo "docker_cgroup_driver=$(docker info --format '{{.CgroupDriver}}')"
        echo "docker_cgroup_version=$(docker info --format '{{.CgroupVersion}}')"
        [ "$(docker info --format '{{.CgroupVersion}}')" = 2 ] || { echo "Docker must use cgroup v2"; exit 1; }
        bpftrace --version
        ls -l /sys/kernel/btf/vmlinux || { echo "BTF (/sys/kernel/btf/vmlinux) is required"; exit 1; }
        grep -E ' (throttle_cfs_rq|unthrottle_cfs_rq)$' /proc/kallsyms || { echo "throttle_cfs_rq / unthrottle_cfs_rq not found in /proc/kallsyms"; exit 1; }
        sudo timeout 30 bpftrace -e 'kprobe:throttle_cfs_rq { } kprobe:unthrottle_cfs_rq { } BEGIN { printf("sizeof(struct cfs_rq)=%d\n", sizeof(struct cfs_rq)); exit(); }' || { echo "bpftrace could not attach kprobes to throttle_cfs_rq / unthrottle_cfs_rq"; exit 1; }

    - name: Record runner environment
      shell: bash
      working-directory: cpu-quota-throttling-p99
      run: |
        mkdir -p results
        {
          echo "section=${{ inputs.section }}"
          echo "host=$(hostname)"
          echo "cpu_model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)"
          echo "nproc=$(nproc)"
          echo "kernel=$(uname -r)"
          echo "os=$(. /etc/os-release; echo "$PRETTY_NAME")"
          echo "cgroup_fs=$(stat -fc %T /sys/fs/cgroup)"
          echo "docker=$(docker version --format '{{.Server.Version}}')"
          echo "docker_cgroup_driver=$(docker info --format '{{.CgroupDriver}}')"
          echo "docker_cgroup_version=$(docker info --format '{{.CgroupVersion}}')"
          echo "bpftrace=$(bpftrace --version)"
          echo "go=$(go version)"
          echo "exec=local same_host=${SAME_HOST:-} dur=${DUR:-}"
          grep -E '^CONFIG_(HZ|CFS_BANDWIDTH|PREEMPT_DYNAMIC)=' "/boot/config-$(uname -r)" || true
          lscpu
          cat /proc/pressure/cpu
          docker ps -a
        } | tee "results/runner_${{ inputs.section }}.txt"
