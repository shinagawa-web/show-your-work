apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app
  annotations:
    secret.reloader.stakater.com/reload: app-db
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: app
      containers:
        - name: app
          image: @IMAGE@
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: app-db
                  key: host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-db
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db
                  key: password
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 1
          lifecycle:
            preStop:
              sleep:
                seconds: 5
