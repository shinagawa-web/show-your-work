apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: app
      containers:
        - name: app
          image: @IMAGE@
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: @DB_HOST@
            - name: DB_NAME
              value: appdb
            - name: DB_USER
              value: app_iam
            - name: DB_CONN_MAX_LIFETIME
              value: 1m
            - name: RDS_CA_BUNDLE
              value: /etc/rds-ca/bundle.pem
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds-ca
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 1
          lifecycle:
            preStop:
              sleep:
                seconds: 5
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca
